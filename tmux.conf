# set prefix to backtick
unbind C-b
set -g prefix `
bind ` send-prefix

# kill panes and windows fast
bind x kill-pane

# visual character split window
bind | split-window -h
bind - split-window -v

# enable mouse selection and scrolling
set -g mouse on

set-option -g default-shell /bin/zsh

# Add true color support
# $TERM, fix colors / use true colors
# set -g default-terminal "tmux-256color"
set -g default-terminal "screen-256color"
# XXX this seems to be the setting breaking neomutt
# (artefacts in index after opening the pager)
# set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Copy / clipboard (macOS) ---
# Terminal integration when supported (iTerm, Cursor, etc.)
set -g set-clipboard on

setw -g mode-keys vi

# ` [ — enter copy mode (prefix is backtick)
bind [ copy-mode

# Vi keys in copy mode: v select, y yank to macOS clipboard
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy -in 2>/dev/null || pbcopy"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy -in 2>/dev/null || pbcopy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy -in 2>/dev/null || pbcopy"

# Emacs keys in copy mode (if you switch mode-keys)
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy -in 2>/dev/null || pbcopy"

# ` ] — paste from macOS clipboard into tmux
bind ] run "tmux load-buffer \"$(pbpaste)\"; tmux paste-buffer"
# Bottom right: clock.
set -g status-interval 30
set -g status-right-length 120
set -g status-right '%-I:%M %p '
